name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v0.1.0
        required: false
        type: string
      dry_run:
        description: Build the current commit as v0.0.0-dryrun and skip publishing
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  tag:
    name: tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      ref: ${{ steps.tag.outputs.ref }}
    steps:
      - id: tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = true ]; then
            echo "tag=v0.0.0-dryrun" >> "$GITHUB_OUTPUT"
            echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::not a release tag: $TAG"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ref=$TAG" >> "$GITHUB_OUTPUT"

  binaries:
    name: binaries (${{ matrix.arch }})
    needs: tag
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile && bun run build
        working-directory: web
      - name: Build on Debian 12 (glibc 2.36) with x264 linked statically
        env:
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          go_version=$(sed -n 's/^go //p' go.mod)
          docker run --rm -v "$PWD:/src" -w /src -e TAG -e COMMIT="$(git rev-parse --short=12 HEAD)" \
            "golang:$go_version-bookworm" sh -c 'sh scripts/release-build.sh "$TAG" && chown -R '"$(id -u):$(id -g)"' dist bin'
          test -f "dist/agora-$TAG-linux-${{ matrix.arch }}.tar.gz"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agora-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: publish
    needs: [tag, binaries]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: agora-*
          path: dist
          merge-multiple: true
      - run: sha256sum -- *.tar.gz > SHA256SUMS
        working-directory: dist
      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ needs.tag.outputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          v=${TAG#v}
          if [ "$DRY_RUN" = true ]; then
            v=$(sed -n 's/^## \[\([0-9][^]]*\)\].*/\1/p' CHANGELOG.md | head -n 1)
          fi
          awk -v v="$v" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[[^]]+\]: / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for $v"
            exit 1
          fi
          cat notes.md dist/SHA256SUMS
      - name: Create the GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          pre=
          case "$TAG" in *-*) pre=--prerelease ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.tar.gz dist/SHA256SUMS --clobber
          else
            gh release create "$TAG" --verify-tag --title "Agora $TAG" --notes-file notes.md $pre dist/*.tar.gz dist/SHA256SUMS
          fi
