name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: go
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libx264-dev libva-dev pkg-config xvfb x11-apps
      - name: gofmt
        run: |
          out=$(gofmt -l cmd internal e2e web)
          if [ -n "$out" ]; then echo "$out"; exit 1; fi
      - run: go vet ./...
      - run: go test -race ./internal/... -count=1
      - run: make build && bin/agora version

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install Xvfb, x264 and Chrome
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libx264-dev libva-dev pkg-config
          if ! command -v google-chrome >/dev/null; then
            curl -fsSL -o /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get install -y -qq /tmp/chrome.deb
          fi
          google-chrome --version
      - run: go test ./e2e/ -count=1 -timeout 25m -v

  privileged:
    name: privileged
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install Xvfb, x264 and Chrome
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libx264-dev libva-dev pkg-config
          if ! command -v google-chrome >/dev/null; then
            curl -fsSL -o /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get install -y -qq /tmp/chrome.deb
          fi
          google-chrome --version
      - name: Create the agora and agora-x users
        run: |
          sudo useradd --system --create-home --home-dir /var/lib/agora-apps --shell /usr/sbin/nologin agora
          sudo useradd --system --no-create-home --home-dir /nonexistent --shell /usr/sbin/nologin agora-x
      - name: Privilege-separation unit tests as root
        run: |
          set -o pipefail
          sudo env "PATH=$PATH" go test -v -count=1 \
            -run 'TestPrepareWSDir|TestWorktreeRefusesReposNotOwnedByDaemon|TestXUserXvfbAttachesShm|TestBrowserSemantic|TestHelperDropsPrivileges|TestHelperJoinsNetworkNamespace' \
            ./internal/core/ ./internal/x11/ ./internal/browser/ ./internal/sandbox/ 2>&1 | tee privileged-unit.log
      - name: Sandbox e2e tests as root
        run: |
          set -o pipefail
          sudo env "PATH=$PATH" go test -v -count=1 -timeout 20m \
            -run 'TestSandboxedWorkspace|TestWorkspacesAreSandboxedByDefault|TestExperimentalNetns|TestSoftwareWebGLInSandbox' \
            ./e2e/ 2>&1 | tee privileged-e2e.log
      - name: None of them may skip
        run: |
          for t in TestPrepareWSDir TestWorktreeRefusesReposNotOwnedByDaemon TestXUserXvfbAttachesShm TestBrowserSemantic TestHelperDropsPrivileges TestHelperJoinsNetworkNamespace TestSandboxedWorkspace TestWorkspacesAreSandboxedByDefault TestExperimentalNetns TestSoftwareWebGLInSandbox; do
            if ! grep -q -- "--- PASS: $t " privileged-unit.log privileged-e2e.log; then
              echo "::error::$t did not pass (skipped, renamed or failed)"
              exit 1
            fi
          done
          if grep -- '--- SKIP' privileged-unit.log privileged-e2e.log; then
            echo "::error::a privileged test was skipped"
            exit 1
          fi

  web:
    name: web
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun run typecheck
        working-directory: web
      - run: bun test
        working-directory: web
      - run: bun run build
        working-directory: web
      - name: web/dist is up to date
        run: |
          if [ -n "$(git status --porcelain -- web/dist)" ]; then
            git status --short -- web/dist
            git diff --stat -- web/dist
            echo "::error::web/dist is stale: run 'make web' and commit web/dist"
            exit 1
          fi

  plugin:
    name: paseo-plugin
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
        working-directory: paseo-plugin
      - run: bun run typecheck
        working-directory: paseo-plugin
      - run: bun test
        working-directory: paseo-plugin

  scripts:
    name: scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck -s sh -S warning scripts/install.sh scripts/uninstall.sh scripts/release-build.sh
